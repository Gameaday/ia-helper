name: Diagnose AAB permissions

# One-shot: runs only when this file itself changes (this push), posts the
# production AAB's merged permission list + injector hunt to issue #81,
# then never runs again. Delete after use.
on:
  push:
    paths:
      - '.github/workflows/diagnose-aab-perms.yml'

concurrency:
  group: diagnose-aab-perms
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build production AAB
        run: flutter build appbundle --release --flavor production --no-tree-shake-icons

      - name: Extract permissions and post to #81
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAB="build/app/outputs/bundle/productionRelease/app-production-release.aab"
          {
            echo "Production AAB merged-manifest permissions (what Google Play scans), built from this commit:"
            echo ""
            echo "```"
            if unzip -p "$AAB" base/manifest/AndroidManifest.xml > /tmp/manifest.bin 2>/dev/null && [ -s /tmp/manifest.bin ]; then
              strings /tmp/manifest.bin | grep -o 'android.permission\.[A-Z_]*' | sort -u
            else
              echo "EXTRACTION FAILED at base/manifest/AndroidManifest.xml - AAB entries mentioning manifest:"
              unzip -l "$AAB" 2>/dev/null | grep -i manifest | head -10
              echo "END EXTRACTION FAILURE"
            fi
            echo "```"
            echo ""
            echo "Injector hunt - library manifests in the build tree that declare READ_MEDIA (stripped from the AAB by the production overlay, but named here for the record):"
            echo "```"
            find build android/app/build -name AndroidManifest.xml 2>/dev/null | while IFS= read -r f; do
              if strings "$f" 2>/dev/null | grep -q 'READ_MEDIA'; then echo "$f"; fi
            done
            echo "```"
          } > /tmp/comment.md
          gh api --method POST repos/Gameaday/ia-helper/issues/81/comments -F body=@/tmp/comment.md
