name: Diagnose analyze

# TEMPORARY diagnostic (#98): dart analyze failed on main (21 issues, at
# least one warning/error) but the annotation channel only shows the last
# few info lines. This dumps the FULL analyze log + Flutter version to a
# comment on #98, then exits 0. Delete after use.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: diagnose-analyze
  cancel-in-progress: true

jobs:
  analyze:
    name: Dump analyze log
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze and dump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          flutter --version > /tmp/version.txt 2>&1
          dart analyze --fatal-warnings > /tmp/analyze.log 2>&1
          rc=$?
          set -e
          {
            echo 'Full `dart analyze --fatal-warnings` output (temporary diagnose run, exit code '"$rc"'):'
            echo ''
            echo '```'
            cat /tmp/version.txt
            cat /tmp/analyze.log
            echo '```'
          } > /tmp/comment.md
          gh api --method POST repos/Gameaday/ia-helper/issues/98/comments -F body=@/tmp/comment.md
          exit 0
