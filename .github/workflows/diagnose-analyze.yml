name: Diagnose analyze (temporary)

on:
  push:
    branches: [ main ]

concurrency:
  group: diagnose-analyze
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    name: Post analyze findings to issue 83
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Runs the same command as the CI Analyze step and posts the FULL
      # analyzer output as an issue comment, because step logs are
      # admin-only on this repo. The first version filtered for bullet
      # lines and matched nothing, so the format is unknown. Temporary:
      # delete this workflow once the failure is fixed.
      - name: Analyze and post findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          dart analyze --fatal-warnings > /tmp/analyze.log 2>&1
          rc=$?
          set -e
          cat /tmp/analyze.log
          {
            echo "Automated diagnosis: dart analyze --fatal-warnings exited with code $rc"
            echo ""
            echo '```'
            tail -100 /tmp/analyze.log || true
            echo '```'
            echo ""
            echo "_Posted by the temporary diagnose workflow; it will be removed once the failure is fixed._"
          } > /tmp/comment.md
          gh issue comment 83 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          exit 0
