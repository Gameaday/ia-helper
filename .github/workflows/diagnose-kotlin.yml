name: Diagnose Kotlin build

# Temporary (#90/#92): MainActivity.kt gained the notification handler
# (#92) and the SAF channel (#90); the first CI build to reach Kotlin
# compilation failed at :app:compileDevelopmentDebugKotlin but the CI
# grep does not capture Kotlin's "e:" diagnostics. This workflow runs
# the compile task alone and posts the full diagnostics as an issue
# comment. Deleted after diagnosis.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-kotlin.yml']

concurrency:
  group: diagnose-kotlin
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Compile Kotlin (development debug)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cd android
          ./gradlew :app:compileDevelopmentDebugKotlin --no-daemon > /tmp/kotlin.log 2>&1
          rc=$?
          cd ..
          {
            echo "Kotlin compile diagnostics (exit code $rc):"
            echo ""
            echo '```'
            grep -E '^\s*e: |error:|\.kt:[0-9]+' /tmp/kotlin.log | head -60
            echo "--- tail ---"
            tail -40 /tmp/kotlin.log
            echo '```'
          } > /tmp/body.md
          gh api repos/Gameaday/ia-helper/issues/90/comments -F body=@/tmp/body.md
          exit 0
