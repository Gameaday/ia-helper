name: Diagnose tests

# Temporary (#91/#92): the flutter-ci runs on 18d268a and 5834c43 both
# failed the test step with "292 tests passed, 3 failed", but a single
# diagnose run of the same suite passed 295/295 - the failures are
# flaky/load-sensitive. This workflow runs the suite up to 3 rounds,
# captures the first failing round in full, and posts it as an issue
# comment. Deleted after diagnosis.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-tests.yml']

concurrency:
  group: diagnose-tests
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests (up to 3 rounds, capture first failure)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          failed_round=0
          for i in 1 2 3; do
            flutter test --reporter expanded 2>&1 | tee /tmp/test-round.log
            rc=$?
            if [ $rc -ne 0 ]; then
              failed_round=$i
              break
            fi
            echo "=== round $i passed ==="
          done
          {
            if [ $failed_round -ne 0 ]; then
              echo "flutter test round $failed_round of 3 FAILED (other rounds may have passed - these are flaky tests):"
              echo ""
            else
              echo "All 3 rounds passed; the CI failures did not reproduce."
              echo ""
            fi
            echo '```'
          } > /tmp/body.md
          if [ $failed_round -ne 0 ]; then
            awk '/\[E\]/{f=1} f' /tmp/test-round.log | tail -n 400 >> /tmp/body.md
          fi
          {
            echo '```'
          } >> /tmp/body.md
          gh api repos/Gameaday/ia-helper/issues/92/comments -F body=@/tmp/body.md
          exit 0
