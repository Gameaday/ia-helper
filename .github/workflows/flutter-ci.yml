name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-warnings

      - name: Test
        run: flutter test

  build-android:
    name: Build production AAB
    runs-on: ubuntu-24.04
    needs: analyze
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build production AAB
        run: |
          flutter pub get
          # --no-tree-shake-icons avoids icon tree-shaker build failures.
          # Signed releases for Google Play are built by play-release.yml on v* tags.
          flutter build appbundle --release --flavor production --no-tree-shake-icons
