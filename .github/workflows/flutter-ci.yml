name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Step logs on this repo are admin-only; analyzer findings are only
      # visible without log-download rights when re-emitted as ::error
      # annotations (same channel as the build step below).
      - name: Analyze
        run: |
          set +e
          dart analyze --fatal-warnings > /tmp/analyze.log 2>&1
          rc=$?
          set -e
          cat /tmp/analyze.log
          if [ $rc -ne 0 ]; then
            grep -E " • " /tmp/analyze.log | head -20 > /tmp/keylines.txt
            echo "--- last 10 lines ---" >> /tmp/keylines.txt
            tail -10 /tmp/analyze.log >> /tmp/keylines.txt
            i=0
            while IFS= read -r line && [ $i -lt 10 ]; do
              [ -z "$line" ] && continue
              printf "::error::%.240s\n" "$line"
              i=$((i+1))
            done < /tmp/keylines.txt
          fi
          exit $rc

      # Test failures (compile errors, assertion failures) re-emitted as
      # ::error annotations, same reason as above.
      - name: Test
        run: |
          set +e
          flutter test > /tmp/test.log 2>&1
          rc=$?
          set -e
          cat /tmp/test.log
          if [ $rc -ne 0 ]; then
            # Compact reporter marks failures with "[E]" followed by the
            # assertion diff and stack; capture those first (test names),
            # then the generic key lines.
            grep -nA 10 '\[E\]' /tmp/test.log | head -80 > /tmp/keylines.txt
            echo "--- generic key lines ---" >> /tmp/keylines.txt
            grep -nE "Error:|Exception|FAILED|Compilation error|Expected:|Actual:|Some tests failed" /tmp/test.log | tail -20 >> /tmp/keylines.txt
            echo "--- last 15 lines ---" >> /tmp/keylines.txt
            tail -15 /tmp/test.log >> /tmp/keylines.txt
            i=0
            while IFS= read -r line && [ $i -lt 20 ]; do
              [ -z "$line" ] && continue
              printf "::error::%.240s\n" "$line"
              i=$((i+1))
            done < /tmp/keylines.txt
          fi
          exit $rc

  build-android:
    name: Build production AAB
    runs-on: ubuntu-24.04
    needs: analyze
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Captures the full build log so that on failure the key Gradle error
      # lines are re-emitted as ::error annotations, which are visible
      # without admin log-download rights (this repo's logs are admin-only).
      - name: Build production AAB
        run: |
          set +e
          flutter build appbundle --release --flavor production --no-tree-shake-icons > /tmp/build.log 2>&1
          rc=$?
          set -e
          cat /tmp/build.log
          if [ $rc -ne 0 ]; then
            {
              grep -nE "FAILURE|error:|ERROR|Exception|Caused by|Could not|Unsupported|incompatible|must not|Execution failed|A problem occurred|Build failed|already on the classpath|\.kt:[0-9]+|^\s*e: " /tmp/build.log | tail -40
              echo "--- last 15 lines ---"
              tail -15 /tmp/build.log
            } > /tmp/keylines.txt
            i=0
            while IFS= read -r line && [ $i -lt 10 ]; do
              [ -z "$line" ] && continue
              printf "::error::%.240s\n" "$line"
              i=$((i+1))
            done < /tmp/keylines.txt
          fi
          exit $rc

      # Play policy guard: the merged manifest (app + all plugins) is what
      # Google Play scans. Phase 0 (#81/#82) removed all media/storage
      # permissions; #92 re-added POST_NOTIFICATIONS, which is expected and
      # asserted present below. This step fails the build if a media/storage
      # permission ever reappears via the manifest merger.
      - name: Guard merged manifest permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          AAB="build/app/outputs/bundle/productionRelease/app-production-release.aab"
          VIOL=0
          if [ ! -f "$AAB" ]; then
            echo "::error::AAB not found at $AAB - permission guard cannot run"
            find build/app/outputs -type f 2>/dev/null | head -5 | while IFS= read -r f; do printf "::error::output: %s\n" "$f"; done
            exit 1
          fi
          echo "--- permissions inside built AAB manifest ---"
          # In an AAB (unlike an APK) the merged manifest lives at base/manifest/AndroidManifest.xml
          unzip -p "$AAB" base/manifest/AndroidManifest.xml > /tmp/manifest.bin
          rc=$?
          if [ $rc -ne 0 ] || [ ! -s /tmp/manifest.bin ]; then
            echo "::error::Could not extract base/manifest/AndroidManifest.xml from the AAB (unzip rc=$rc) - aborting so the guard cannot pass vacuously"
            unzip -l "$AAB" 2>/dev/null | grep -i manifest | head -5 | while IFS= read -r l; do printf "::error::AAB entry: %s\n" "$l"; done
            exit 1
          fi
          strings /tmp/manifest.bin | grep -o "android.permission\.[A-Z_]*" | sort -u | tee /tmp/perms.txt
          if ! grep -q "android.permission.INTERNET" /tmp/perms.txt; then
            echo "::error::Sanity check failed: INTERNET missing from extracted permission list - extraction unreliable, refusing to pass vacuously"
            exit 1
          fi
          echo "---------------------------------------------"
          cat /tmp/perms.txt | while IFS= read -r p; do printf "::notice::AAB permission: %s\n" "$p"; done
          if grep -qE "READ_MEDIA|EXTERNAL_STORAGE" /tmp/perms.txt; then
            VIOL=1
            grep -E "READ_MEDIA|EXTERNAL_STORAGE" /tmp/perms.txt | while IFS= read -r line; do printf "::error::%s in AAB manifest (Play policy risk)\n" "$line"; done
            {
              echo "Play-policy-sensitive permissions found in the production AAB manifest:"
              echo ""
              echo "```"
              grep -E "READ_MEDIA|EXTERNAL_STORAGE" /tmp/perms.txt
              echo "```"
              echo ""
              echo "Injector hunt - build-tree manifests declaring READ_MEDIA:"
              echo "```"
              find build android/app/build -name AndroidManifest.xml 2>/dev/null | while IFS= read -r f; do
                if strings "$f" 2>/dev/null | grep -q "READ_MEDIA"; then echo "$f"; fi
              done
              echo "```"
            } > /tmp/comment.md
            gh api --method POST repos/Gameaday/ia-helper/issues/81/comments -F body=@/tmp/comment.md
          fi
          # #92: POST_NOTIFICATIONS is now expected in the production AAB
          # (download progress/completion notifications ship together with
          # the declaration). A build where it goes missing regressed.
          if ! grep -q "android.permission.POST_NOTIFICATIONS" /tmp/perms.txt; then
            echo "::error::POST_NOTIFICATIONS missing from the production AAB manifest - expected since #92 (declaration + usage ship together)"
            VIOL=1
          fi
          if [ $VIOL -ne 0 ]; then exit 1; fi

      # v2.0 (#98): size budget. Measures the built AAB and the equivalent
      # universal APK (all ABIs/densities, worst-case install footprint)
      # with bundletool, fails if either exceeds budget, and re-emits sizes
      # as ::notice annotations (step logs are admin-only on this repo).
      # Budgets start generous (first measurement run); ratchet down after
      # the first numbers land.
      - name: Enforce AAB size budget
        env:
          AAB_BUDGET_MB: '90'
          UNIVERSAL_BUDGET_MB: '130'
        run: |
          set +e
          AAB="build/app/outputs/bundle/productionRelease/app-production-release.aab"
          VIOL=0
          if [ ! -f "$AAB" ]; then
            echo "::error::AAB not found at $AAB - size budget cannot run"
            exit 1
          fi
          AAB_MB=$(du -m "$AAB" | cut -f1)
          echo "--- AAB module breakdown (MB) ---"
          unzip -l "$AAB" | awk '$1 ~ /^[0-9]+$/ {split($NF,p,"/"); mod=(p[2]!="") ? p[1]"/"p[2] : p[1]; size[mod]+=$1} END {for (m in size) printf "%8.1f  %s\n", size[m]/1048576, m}' | sort -rn | head -20
          echo "---------------------------------------------"
          curl -fsSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::Failed to download bundletool 1.18.3 (rc=$rc) - size budget cannot run"
            exit 1
          fi
          keytool -genkeypair -keystore /tmp/debug.keystore -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1
          java -jar /tmp/bundletool.jar build-apks --bundle="$AAB" --output=/tmp/app.apks --mode=universal --ks=/tmp/debug.keystore --ks-pass=pass:android --ks-key-alias=androiddebugkey >/tmp/bundletool.log 2>&1
          rc=$?
          if [ $rc -ne 0 ] || [ ! -f /tmp/app.apks ]; then
            echo "::error::bundletool build-apks failed (rc=$rc) - size budget cannot run"
            tail -20 /tmp/bundletool.log | while IFS= read -r l; do printf "::error::bundletool: %s\n" "$l"; done
            exit 1
          fi
          unzip -p /tmp/app.apks universal.apk > /tmp/universal.apk
          rc=$?
          if [ $rc -ne 0 ] || [ ! -s /tmp/universal.apk ]; then
            echo "::error::Could not extract universal.apk from the .apks archive (rc=$rc)"
            exit 1
          fi
          UNI_MB=$(du -m /tmp/universal.apk | cut -f1)
          echo "AAB: ${AAB_MB} MB (budget ${AAB_BUDGET_MB} MB)"
          echo "Universal APK: ${UNI_MB} MB (budget ${UNIVERSAL_BUDGET_MB} MB)"
          printf "::notice::AAB size: %s MB (budget %s MB)\n" "$AAB_MB" "$AAB_BUDGET_MB"
          printf "::notice::Universal APK size: %s MB (budget %s MB)\n" "$UNI_MB" "$UNIVERSAL_BUDGET_MB"
          if [ "$AAB_MB" -gt "$AAB_BUDGET_MB" ]; then
            echo "::error::AAB size ${AAB_MB} MB exceeds budget ${AAB_BUDGET_MB} MB - check module breakdown above"
            VIOL=1
          fi
          if [ "$UNI_MB" -gt "$UNIVERSAL_BUDGET_MB" ]; then
            echo "::error::Universal APK size ${UNI_MB} MB exceeds budget ${UNIVERSAL_BUDGET_MB} MB"
            VIOL=1
          fi
          if [ $VIOL -ne 0 ]; then exit 1; fi
