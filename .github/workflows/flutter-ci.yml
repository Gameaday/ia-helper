name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-warnings

      - name: Test
        run: flutter test

  build-android:
    name: Build production AAB
    runs-on: ubuntu-24.04
    needs: analyze
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Captures the full build log so that on failure the key Gradle error
      # lines are re-emitted as ::error annotations, which are visible
      # without admin log-download rights (this repo's logs are admin-only).
      - name: Build production AAB
        run: |
          set +e
          flutter build appbundle --release --flavor production --no-tree-shake-icons > /tmp/build.log 2>&1
          rc=$?
          set -e
          cat /tmp/build.log
          if [ $rc -ne 0 ]; then
            {
              grep -nE "FAILURE|error:|ERROR|Exception|Caused by|Could not|Unsupported|incompatible|must not|Execution failed|A problem occurred|Build failed|already on the classpath" /tmp/build.log | tail -40
              echo "--- last 15 lines ---"
              tail -15 /tmp/build.log
            } > /tmp/keylines.txt
            i=0
            while IFS= read -r line && [ $i -lt 10 ]; do
              [ -z "$line" ] && continue
              printf "::error::%.240s\n" "$line"
              i=$((i+1))
            done < /tmp/keylines.txt
          fi
          exit $rc
