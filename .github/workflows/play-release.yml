name: Play Store Release Build

# Builds the signed production AAB whenever a version tag is pushed.
# The AAB is attached to the matching GitHub Release, ready to upload to Play Console.
#
# One-time setup (see docs/store/play-console-steps.md):
#   1. Generate an upload keystore locally
#   2. Add these repository secrets:
#        ANDROID_KEYSTORE_BASE64   - base64 of the .jks file
#        ANDROID_KEYSTORE_PASSWORD - keystore password
#        ANDROID_KEY_ALIAS         - key alias
#        ANDROID_KEY_PASSWORD      - key password
#
# Release: git tag v1.7.1 && git push origin v1.7.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Release builds are never canceled by CI churn: they queue instead.
concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  build-release-aab:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for version generation)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check signing secrets are present
        # The `secrets` context is NOT allowed in `if:` conditionals — GitHub rejects the
        # entire workflow file as invalid (Unrecognized named-value: 'secrets'). An env
        # reference is allowed, so the fail-fast check runs in shell instead.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo '::error::ANDROID_KEYSTORE_BASE64 secret is missing.'
            echo 'Add the four ANDROID_* secrets (see docs/store/play-console-steps.md) and re-run.'
            exit 1
          fi

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # Captures the full build log so that on failure the key Gradle error
      # lines are re-emitted as ::error annotations, which are visible
      # without admin log-download rights (this repo's logs are admin-only).
      - name: Build production AAB
        run: |
          set +e
          flutter build appbundle --release --flavor production > /tmp/build.log 2>&1
          rc=$?
          set -e
          cat /tmp/build.log
          if [ $rc -ne 0 ]; then
            {
              grep -nE "FAILURE|error:|ERROR|Exception|Caused by|Could not|Unsupported|incompatible|must not|Execution failed|A problem occurred|Build failed|already on the classpath" /tmp/build.log | tail -40
              echo "--- last 15 lines ---"
              tail -15 /tmp/build.log
            } > /tmp/keylines.txt
            i=0
            while IFS= read -r line && [ $i -lt 10 ]; do
              [ -z "$line" ] && continue
              printf "::error::%.240s\n" "$line"
              i=$((i+1))
            done < /tmp/keylines.txt
          fi
          exit $rc

      - name: Report artifact
        run: |
          echo 'AAB built:'
          ls -lh build/app/outputs/bundle/productionRelease/*.aab

      - name: Attach AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/bundle/productionRelease/app-production-release.aab
          generate_release_notes: true
          prerelease: false
          # Fail loudly if the AAB is missing instead of silently publishing an empty release.
          fail_on_unmatched_files: true
