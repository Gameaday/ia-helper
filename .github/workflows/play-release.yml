name: Play Store Release Build

# Builds the signed production AAB whenever a version tag is pushed.
# The AAB is attached to the matching GitHub Release, ready to upload to Play Console.
#
# One-time setup (see docs/store/play-console-steps.md):
#   1. Generate an upload keystore locally
#   2. Add these repository secrets:
#        ANDROID_KEYSTORE_BASE64   - base64 of the .jks file
#        ANDROID_KEYSTORE_PASSWORD - keystore password
#        ANDROID_KEY_ALIAS         - key alias
#        ANDROID_KEY_PASSWORD      - key password
#
# Release: git tag v1.7.1 && git push origin v1.7.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for version generation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check signing secrets are present
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo '::error::ANDROID_KEYSTORE_BASE64 secret is missing.'
          echo 'Add the four ANDROID_* secrets (see docs/store/play-console-steps.md) and re-run.'
          exit 1

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build production AAB
        run: flutter build appbundle --release --flavor production

      - name: Report artifact
        run: |
          echo 'AAB built:'
          ls -lh build/app/outputs/bundle/productionRelease/*.aab

      - name: Attach AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/bundle/productionRelease/app-production-release.aab
          generate_release_notes: true
