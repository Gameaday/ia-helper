# Gradle JVM settings (GitHub Actions runners have 7 GB RAM)
org.gradle.jvmargs=-Xmx4G -Xms512m -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Reuse task outputs between builds
org.gradle.caching=true

# AndroidX is required by all modern Flutter plugins
android.useAndroidX=true

# AGP 9 enables its new DSL and built-in Kotlin by default. The Flutter Gradle
# plugin and this project's Groovy build scripts use the classic DSL and the
# external Kotlin plugin, so opt out (same flags a fresh 'flutter create'
# template ships with).
android.newDsl=false
android.builtInKotlin=false
