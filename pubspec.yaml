name: internet_archive_helper
description: Internet Archive Helper - Mobile app for downloading files from the Internet Archive
version: 1.8.0

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI and state management
  provider: ^6.1.5
  
  # Storage and file management
  path_provider: ^2.1.6
  permission_handler: ^12.0.1  # no direct usage after #81/#82 (app-scoped storage); kept for the Phase 3 notifications feature (#92). 13.x requires compileSdk 37 (AGP 9.1 max 36); bump together with AGP when the Flutter template moves
  open_file: ^4.0.0
  sqflite: ^2.4.5  # SQLite for metadata caching
  sqflite_common_ffi_web: ^1.2.0  # Web-compatible SQLite using IndexedDB
  
  # Network and download
  http: ^1.6.0
  dio: ^5.11.1
  connectivity_plus: ^7.3.2  # Network connectivity monitoring
  
  # Cryptography for checksum validation
  crypto: ^3.0.8
  
  # UI enhancements
  flutter_spinkit: ^5.2.2
  percent_indicator: ^4.2.5
  
  # File preview support
  cached_network_image: ^4.0.6  # Image caching and display
  photo_view: ^0.15.0  # Image zoom and pan
  flutter_highlight: ^0.7.0  # Syntax highlighting
  flutter_markdown: ^0.7.7  # Markdown rendering
  pdfx: ^2.11.0  # PDF document rendering
  just_audio: ^0.10.6  # Audio playback
  chewie: ^1.17.4  # Video player with controls
  video_player: ^2.14.1  # Video playback support
  mime: ^2.1.0  # MIME type detection
  image: ^4.12.0  # Image processing and resizing
  share_plus: ^13.3.1  # Cross-platform sharing (SharePlus.instance.share / ShareParams)
  
  # Utilities
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  app_links: ^7.2.2
  path: ^1.9.1
  
  # Archive decompression
  archive: ^4.6.0  # Allow patch updates
  
  # Code generation support
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # integration_test:
  #   sdk: flutter
  # Commented out: Causes compilation errors in release builds
  # The plugin gets registered but isn't included in release dependencies
  flutter_lints: ^6.0.0
  mockito: ^5.8.1
  # SQLite FFI for database/migration tests in the Dart VM (#84)
  sqflite_common_ffi: ^2.3.0
  
  # Code generation tools
  build_runner: ^2.16.2
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

